<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Belépés – Vezetői Tájékoztató Portál</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://api.fontshare.com"><link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">
<style>
:root{--bg:#090e14;--fg:#f4f4f7;--muted:#a1a1aa;--primary:#6000ff;--lilac:#aa99ff;--input:#10161f;--line:rgba(255,255,255,.1);color-scheme:dark}
:root[data-theme="light"]{--bg:#f8f8f8;--fg:#0b0b12;--muted:#5b5b66;--lilac:#4b2fb0;--input:#ffffff;--line:rgba(10,10,30,.12);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Satoshi",ui-sans-serif,system-ui,sans-serif;display:grid;min-height:100vh}
.hero{color:#fff;position:relative;isolation:isolate;overflow:hidden;padding:clamp(28px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;background:#2d2849 url("/img/cathedral.jpg") center/cover no-repeat}
.mark{width:44px;height:44px;border-radius:12px;background:var(--primary);display:grid;place-items:center}
.hero h1{font-size:clamp(34px,4.6vw,60px);font-weight:400;letter-spacing:-.02em;line-height:1.05;margin:0 0 16px;max-width:14ch}
.hero p{color:#d6d3e6;font-size:17px;max-width:46ch;margin:0;line-height:1.6}
.hero .rating{margin-top:28px;color:#aa99ff;font-size:14px}
.panel{display:grid;place-items:center;padding:clamp(24px,4vw,56px)}
.box{width:min(420px,100%)}
h2{font-weight:500;font-size:30px;letter-spacing:-.015em;margin:0 0 6px}
.name{font-weight:700;margin:0 0 28px}
.sub{color:var(--muted);margin:0 0 22px;line-height:1.5}
#clerk{min-height:320px}
.foot{margin-top:22px;color:var(--muted);font-size:12.5px;line-height:1.5}
.foot a{color:var(--lilac)}
@media (max-width:880px){body{grid-template-columns:1fr}.hero{min-height:26vh}}
</style>
</head>
<body>
<section class="panel">
  <div class="box">
    <p class="name">Felsőoktatási Vezetői Tájékoztató Portál</p>
    <h2>Belépés</h2>
    <p class="sub">Naponta frissülő összefoglalók, határidők és dossziék. Belépni meghívóval lehet, Google-fiókkal vagy e-mailben kapott kóddal.</p>
    <div id="clerk"></div>
    <p class="foot">Meghívót és segítséget itt kérhet: <a href="mailto:__CONTACT_EMAIL__">__CONTACT_EMAIL__</a></p>
  </div>
</section>
<script async crossorigin="anonymous"
  data-clerk-publishable-key="__CLERK_PUBLISHABLE_KEY__"
  src="https://__CLERK_FRONTEND_API__/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
  type="text/javascript"></script>
<script>window.FVTP_HU={locale:"hu-HU",dividerText:"vagy",socialButtonsBlockButton:"Folytatás: {{provider|titleize}}",
formFieldLabel__emailAddress:"E-mail-cím",formFieldInputPlaceholder__emailAddress:"nev@pelda.hu",formButtonPrimary:"Tovább",
formFieldLabel__code:"Kód",footerActionLink__useAnotherMethod:"Másik módszer",backButton:"Vissza",
signIn:{start:{title:"Belépés",subtitle:"Folytassa Google-fiókkal vagy e-mail-címmel",actionText:"",actionLink:""},
 emailCode:{title:"Nézze meg a postafiókját",subtitle:"a továbblépéshez",formTitle:"Megerősítő kód",resendButton:"Nem kapott kódot? Újraküldés"},
 alternativeMethods:{title:"Más módszer",actionLink:"Segítség"}},
signUp:{start:{title:"Fiók létrehozása",subtitle:"a meghívó elfogadásához",actionText:"Van már fiókja?",actionLink:"Belépés"},
 emailCode:{title:"E-mail megerősítése",subtitle:"a továbblépéshez",formTitle:"Megerősítő kód",resendButton:"Újraküldés"}},
unstable__errors:{not_allowed_access:"Ez a cím nincs meghívva. Kérjen meghívót a portál adminisztrátorától.",form_identifier_not_found:"Ezzel a címmel nincs meghívott fiók."}};
(function(){try{document.documentElement.setAttribute('data-theme',localStorage.getItem('fvtp-theme')||'dark');}catch(e){}})();
window.addEventListener('load', async () => {
  const light=document.documentElement.getAttribute('data-theme')==='light';
  const q = new URLSearchParams(location.search);
  let next = q.get('next') || '/';
  if (!next.startsWith('/') || next.startsWith('//')) next = '/';
  await Clerk.load({ localization: window.FVTP_HU });
  if (Clerk.user) { location.replace(next); return; }
  // meghívó-link (__clerk_ticket) vagy ?mode=signup → regisztráció, egyébként belépés
  const signup = q.has('__clerk_ticket') || q.get('mode') === 'signup' || q.has('__clerk_status');
  if (signup) { const h = document.querySelector('.box h2'); if (h) h.textContent = 'Meghívó elfogadása'; }
  const opts = {
    forceRedirectUrl: next, fallbackRedirectUrl: next,
    signInUrl: '/belepes', signUpUrl: '/belepes?mode=signup',
    appearance: {
      variables: { colorPrimary: '#6000ff', colorBackground: light?'#ffffff':'#10161f', colorText: light?'#0b0b12':'#f4f4f7', colorTextSecondary: light?'#5b5b66':'#a1a1aa',
                   colorInputBackground: light?'#f8f8f8':'#0c1118', colorInputText: light?'#0b0b12':'#f4f4f7', colorNeutral: light?'#0b0b12':'#ffffff', borderRadius: '8px',
                   fontFamily: 'Satoshi, ui-sans-serif, system-ui, sans-serif', fontSize: '15px' },
      elements: { card: { boxShadow: 'none', border: '1px solid var(--line)' }, formButtonPrimary: { borderRadius: '8px', fontSize: '15px', textTransform: 'none' },
                  socialButtonsBlockButton: { borderRadius: '8px' }, footer: { display: 'none' }, logoBox: { display: 'none' } }
    }
  };
  // a Clerk angol hibaüzenete meghívó nélküli regisztrációnál → magyar, teendővel
  const HU_ERR = { 'New sign-ups are currently restricted.': 'Ezzel a címmel még nincs fiók. Az első belépéshez nyissa meg a meghívó e-mailben kapott linket, és ugyanazzal a címmel (vagy azzal a Google-fiókkal) regisztráljon, amelyre a meghívó érkezett.' };
  new MutationObserver(() => document.querySelectorAll('#clerk p, #clerk span, #clerk div').forEach(el => {
    if (el.childElementCount === 0 && HU_ERR[el.textContent.trim()]) el.textContent = HU_ERR[el.textContent.trim()];
  })).observe(document.getElementById('clerk'), { childList: true, subtree: true, characterData: true });
  if (signup) Clerk.mountSignUp(document.getElementById('clerk'), opts);
  else Clerk.mountSignIn(document.getElementById('clerk'), opts);
});
</script>
</body>
</html>

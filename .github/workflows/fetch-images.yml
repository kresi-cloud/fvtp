name: Fotók letöltése a repóba
on:
  workflow_dispatch:
  push:
    paths: ['scripts/fetch_images.py']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_images.py
      - run: |
          git config user.name "fvtp-bot"
          git config user.email "fvtp-bot@users.noreply.github.com"
          git add -f public/img/*.jpg
          git diff --cached --quiet || (git commit -m "Fotók a repóban (Commons)" && git push)
